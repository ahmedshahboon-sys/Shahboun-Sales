<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b2b"><link rel="manifest" href="manifest.webmanifest"><title>مربوعة | Marboua</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');:root{--bg:#090b12;--panel:#111522;--panel2:#171c2d;--line:#252c42;--text:#f7f8fb;--muted:#9ca5ba;--vio:#8b5cf6;--cyan:#35d1c5;--ok:#72e6aa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#161b35,transparent 30%),var(--bg);color:var(--text);font-family:Cairo,system-ui}.app{max-width:1180px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:13px 16px;background:#090b12ee;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{display:flex;gap:10px;align-items:center;margin-left:auto}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--vio),var(--cyan));display:grid;place-items:center;font-weight:800}.btn{border:1px solid var(--line);background:#121625;color:#fff;border-radius:11px;padding:9px 12px;font:700 12px Cairo;cursor:pointer}.primary{background:linear-gradient(135deg,var(--vio),#6d5dfc);border:0}.ghost{background:transparent}.wrap{padding:16px}.auth{max-width:500px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.field,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#0b0e17;color:#fff;font-family:Cairo;margin:6px 0}.hide{display:none!important}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.pill{white-space:nowrap}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:linear-gradient(160deg,var(--panel),#0d101a);border:1px solid var(--line);border-radius:18px;padding:16px}.person{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;background:#1f2740;display:grid;place-items:center;font-weight:800}.online{width:9px;height:9px;background:var(--ok);border-radius:50%;display:inline-block}.muted{color:var(--muted);font-size:12px;line-height:1.8}.chatLayout{display:grid;grid-template-columns:320px 1fr;gap:12px}.rooms{max-height:70vh;overflow:auto}.room{padding:12px;border-bottom:1px solid var(--line);cursor:pointer}.room:hover{background:#151a2a}.chat{min-height:70vh;display:flex;flex-direction:column}.messages{flex:1;overflow:auto;max-height:58vh;padding:10px;display:flex;flex-direction:column;gap:8px}.msg{max-width:75%;padding:10px 12px;border-radius:14px;background:#1a2032}.mine{margin-right:auto;background:#46318f}.composer{display:flex;gap:8px}.composer .field{margin:0}.empty{padding:30px;text-align:center;color:var(--muted)}.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{border-color:#5a2430;color:#ff9cae}.stat{font-size:24px;font-weight:800}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.chatLayout{grid-template-columns:1fr}.rooms{max-height:260px}.profileGrid{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.top{padding:10px}.wrap{padding:12px}}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">م</div><div><b>مربوعة</b><small class="muted" style="display:block">تواصل بكل بساطة</small></div></div><button class="btn" onclick="location.href='../../'">شهبون</button><button class="btn" id="installBtn">تثبيت</button></header><div class="wrap"><section id="authBox" class="auth"><h2>ادخل لمربوعة</h2><p class="muted">نفس Shahboun ID يخدم هنا. لو أول مرة، كمل ملف مربوعة بعد الدخول.</p><input id="email" class="field" type="email" placeholder="البريد الإلكتروني"><input id="password" class="field" type="password" placeholder="كلمة المرور"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" onclick="signIn()">دخول</button><button class="btn" onclick="signUp()">حساب جديد</button><button class="btn ghost" onclick="resetPassword()">نسيت كلمة المرور</button></div><p id="authMsg" class="muted"></p></section><main id="main" class="hide"><div class="nav"><button class="btn pill primary" onclick="show('discover',this)">الناس</button><button class="btn pill" onclick="show('chats',this)">المحادثات</button><button class="btn pill" onclick="show('groups',this)">المجموعات</button><button class="btn pill" onclick="show('me',this)">حسابي</button><button class="btn pill" onclick="logout()">خروج</button></div><section id="setup" class="card hide"><h2>كمل ملفك في مربوعة</h2><div class="profileGrid"><input id="setupName" class="field" placeholder="الاسم الظاهر"><input id="setupUser" class="field" placeholder="اسم المستخدم"><select id="setupGender"><option value="">اختار</option><option value="male">راجل</option><option value="female">مرا</option></select><input id="setupCity" class="field" placeholder="المدينة"></div><button class="btn primary" onclick="saveSetup()">حفظ وابدأ</button><p id="setupMsg" class="muted"></p></section><section id="discover" class="view active"><div class="card"><div class="profileGrid"><input id="search" class="field" placeholder="ابحث بالاسم أو اليوزر"><select id="genderFilter"><option value="">الكل</option><option value="male">رجالة</option><option value="female">نسوان</option></select></div><button class="btn" onclick="loadPeople()">تحديث</button></div><div id="people" class="grid" style="margin-top:12px"></div></section><section id="chats" class="view"><div class="chatLayout"><div class="card rooms"><h3>محادثاتي</h3><div id="rooms"></div></div><div class="card chat"><div id="chatTitle"><b>اختار محادثة</b></div><div id="messages" class="messages"><div class="empty">اختار شخص وابدأ الحكي.</div></div><div class="composer"><input id="messageInput" class="field" placeholder="اكتب رسالتك..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="btn primary" onclick="sendMessage()">إرسال</button></div></div></div></section><section id="groups" class="view"><div class="card"><h3>دير مجموعة جديدة</h3><input id="groupName" class="field" placeholder="اسم المجموعة"><textarea id="groupDesc" class="field" placeholder="وصف بسيط"></textarea><button class="btn primary" onclick="createGroup()">إنشاء</button></div><div id="groupList" class="grid" style="margin-top:12px"></div></section><section id="me" class="view"><div class="card"><h2>حسابي في مربوعة</h2><div class="profileGrid"><input id="meName" class="field" placeholder="الاسم الظاهر"><input id="meUser" class="field" placeholder="اسم المستخدم"><select id="meGender"><option value="male">راجل</option><option value="female">مرا</option></select><input id="meCity" class="field" placeholder="المدينة"><textarea id="meBio" class="field" placeholder="نبذة عليك"></textarea><div><label class="muted"><input id="discoverable" type="checkbox"> يظهر حسابي للناس</label><br><label class="muted"><input id="allowMessages" type="checkbox"> نسمح بالرسائل</label><br><label class="muted"><input id="allowCalls" type="checkbox"> نسمح بالمكالمات</label></div></div><button class="btn primary" onclick="saveProfile()">حفظ</button></div></section></main></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const U='https://uojytcmeqegnlgvlmexx.supabase.co',K='sb_publishable_IB9p4LAK2s7VLW1u55SJQA_pANuxzHl',s=createClient(U,K);let user=null,profile=null,currentRoom=null,realtime=null,deferred=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));window.signIn=async()=>{authMsg.textContent='جاري الدخول...';const{error}=await s.auth.signInWithPassword({email:email.value.trim(),password:password.value});authMsg.textContent=error?error.message:'تم الدخول';if(!error)boot()};window.signUp=async()=>{const{error}=await s.auth.signUp({email:email.value.trim(),password:password.value,options:{emailRedirectTo:location.origin+location.pathname}});authMsg.textContent=error?error.message:'تم إنشاء الحساب. أكد البريد وارجع لمربوعة.'};window.resetPassword=async()=>{if(!email.value.trim())return authMsg.textContent='اكتب بريدك أول';const{error}=await s.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+location.pathname});authMsg.textContent=error?error.message:'بعثنالك رابط استرجاع.'};window.logout=async()=>{if(user)await s.from('marboua_profiles').update({is_online:false,last_seen_at:new Date().toISOString()}).eq('user_id',user.id);await s.auth.signOut();location.reload()};window.show=(id,b)=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav .btn').forEach(x=>x.classList.remove('primary'));b?.classList.add('primary');if(id==='chats')loadRooms();if(id==='groups')loadGroups();if(id==='me')fillMe()};async function boot(){const{data:{user:u}}=await s.auth.getUser();user=u;if(!u){authBox.classList.remove('hide');main.classList.add('hide');return}authBox.classList.add('hide');main.classList.remove('hide');const{data:p}=await s.from('marboua_profiles').select('*').eq('user_id',u.id).maybeSingle();profile=p;if(!p){setup.classList.remove('hide');discover.classList.add('hide')}else{setup.classList.add('hide');discover.classList.add('active');await s.from('marboua_profiles').update({is_online:true,last_seen_at:new Date().toISOString()}).eq('user_id',u.id);loadPeople();loadRooms()}}window.saveSetup=async()=>{if(!setupGender.value)return setupMsg.textContent='اختار راجل ولا مرا';const{data,error}=await s.rpc('marboua_bootstrap_profile',{p_display_name:setupName.value,p_gender:setupGender.value,p_city:setupCity.value||null,p_username:setupUser.value||null});setupMsg.textContent=error?error.message:'تم';if(!error){profile=data;setup.classList.add('hide');discover.classList.add('active');loadPeople()}};window.loadPeople=async()=>{let q=s.from('marboua_profiles').select('*').eq('is_discoverable',true).neq('user_id',user.id).order('is_online',{ascending:false}).order('created_at',{ascending:false}).limit(60);if(genderFilter.value)q=q.eq('gender',genderFilter.value);const{data}=await q;let arr=data||[],term=search.value.trim().toLowerCase();if(term)arr=arr.filter(x=>(x.display_name||'').toLowerCase().includes(term)||(x.username||'').toLowerCase().includes(term));people.innerHTML=arr.length?arr.map(p=>`<article class="card"><div class="person"><div class="avatar">${esc((p.display_name||'?').slice(0,1))}</div><div><b>${esc(p.display_name)}</b> ${p.is_online?'<span class="online"></span>':''}<div class="muted">@${esc(p.username||'بدون_يوزر')} • ${esc(p.city||'')}</div></div></div><p class="muted">${esc(p.bio||'')}</p><div style="display:flex;gap:7px"><button class="btn primary" onclick="startChat('${p.user_id}','${esc(p.display_name)}')">احكي معاه</button><button class="btn" onclick="blockUser('${p.user_id}')">بلوك</button><button class="btn danger" onclick="reportUser('${p.user_id}')">بلاغ</button></div></article>`).join(''):'<div class="empty">ما لقيناش ناس حسب الفلتر.</div>'};window.startChat=async(id,name)=>{const{data,error}=await s.rpc('marboua_get_or_create_direct',{p_other:id});if(error)return alert(error.message);currentRoom=data;show('chats');chatTitle.innerHTML='<b>'+esc(name)+'</b><div class="muted">محادثة خاصة</div>';await loadRooms();await loadMessages();subscribeRoom()};async function loadRooms(){const{data:m}=await s.from('marboua_room_members').select('room_id,role,joined_at,marboua_rooms(id,room_type,name,updated_at)').eq('user_id',user.id).order('joined_at',{ascending:false});const arr=(m||[]).map(x=>x.marboua_rooms).filter(Boolean);rooms.innerHTML=arr.length?arr.map(r=>`<div class="room" onclick="openRoom('${r.id}','${esc(r.name||'محادثة')}')"><b>${esc(r.name||'محادثة خاصة')}</b><div class="muted">${r.room_type==='group'?'مجموعة':'خاص'}</div></div>`).join(''):'<div class="empty">ما عندكش محادثات.</div>'}window.openRoom=async(id,name)=>{currentRoom=id;chatTitle.innerHTML='<b>'+esc(name)+'</b>';await loadMessages();subscribeRoom()};async function loadMessages(){if(!currentRoom)return;const{data}=await s.from('marboua_messages').select('*').eq('room_id',currentRoom).is('deleted_at',null).order('created_at',{ascending:true}).limit(150);messages.innerHTML=(data||[]).map(x=>`<div class="msg ${x.sender_id===user.id?'mine':''}">${esc(x.body||'')}<div class="muted">${new Date(x.created_at).toLocaleTimeString('ar-LY',{hour:'2-digit',minute:'2-digit'})}</div></div>`).join('')||'<div class="empty">ابدأ أول رسالة.</div>';messages.scrollTop=messages.scrollHeight}window.sendMessage=async()=>{let text=messageInput.value.trim();if(!text||!currentRoom)return;messageInput.value='';const{error}=await s.from('marboua_messages').insert({room_id:currentRoom,sender_id:user.id,body:text});if(error)alert(error.message)};function subscribeRoom(){if(realtime)s.removeChannel(realtime);if(!currentRoom)return;realtime=s.channel('marboua-'+currentRoom).on('postgres_changes',{event:'INSERT',schema:'public',table:'marboua_messages',filter:'room_id=eq.'+currentRoom},()=>loadMessages()).subscribe()}window.createGroup=async()=>{const n=groupName.value.trim();if(!n)return;const{data,error}=await s.rpc('marboua_create_group',{p_name:n,p_description:groupDesc.value.trim()||null});if(error)return alert(error.message);groupName.value='';groupDesc.value='';currentRoom=data;await loadGroups();await loadRooms();alert('تم إنشاء المجموعة')};async function loadGroups(){const{data:m}=await s.from('marboua_room_members').select('room_id,marboua_rooms(id,name,description,room_type)').eq('user_id',user.id);const arr=(m||[]).map(x=>x.marboua_rooms).filter(x=>x?.room_type==='group');groupList.innerHTML=arr.length?arr.map(g=>`<div class="card"><h3>${esc(g.name)}</h3><p class="muted">${esc(g.description||'')}</p><button class="btn primary" onclick="openRoom('${g.id}','${esc(g.name)}');show('chats')">افتح المجموعة</button></div>`).join(''):'<div class="empty">ما عندكش مجموعات توا.</div>'}window.blockUser=async id=>{if(!confirm('تبي تدير بلوك للحساب؟'))return;const{error}=await s.from('marboua_blocks').insert({blocker_id:user.id,blocked_id:id});if(error)alert(error.message);else loadPeople()};window.reportUser=async id=>{let reason=prompt('شن سبب البلاغ؟');if(!reason)return;const{error}=await s.from('marboua_reports').insert({reporter_id:user.id,reported_user_id:id,reason});alert(error?error.message:'تم إرسال البلاغ للإدارة')};function fillMe(){if(!profile)return;meName.value=profile.display_name||'';meUser.value=profile.username||'';meGender.value=profile.gender||'male';meCity.value=profile.city||'';meBio.value=profile.bio||'';discoverable.checked=profile.is_discoverable;allowMessages.checked=profile.allow_messages;allowCalls.checked=profile.allow_calls}window.saveProfile=async()=>{const patch={display_name:meName.value.trim(),username:meUser.value.trim().toLowerCase()||null,gender:meGender.value,city:meCity.value.trim()||null,bio:meBio.value.trim()||null,is_discoverable:discoverable.checked,allow_messages:allowMessages.checked,allow_calls:allowCalls.checked,updated_at:new Date().toISOString()};const{data,error}=await s.from('marboua_profiles').update(patch).eq('user_id',user.id).select().single();if(error)alert(error.message);else{profile=data;alert('تم الحفظ')}};s.auth.onAuthStateChange(()=>boot());boot();addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});installBtn.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else alert('من قائمة المتصفح اختار إضافة للشاشة الرئيسية / تثبيت')};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
