<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة مربوعة</title><style>@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');:root{--b:#090b12;--p:#111522;--l:#252c42;--t:#fff;--m:#9ca5ba;--v:#8b5cf6;--r:#ff8599}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:Cairo,system-ui}.w{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.btn{border:1px solid var(--l);background:#121625;color:#fff;border-radius:11px;padding:9px 12px;font-family:inherit;cursor:pointer;text-decoration:none}.primary{background:var(--v);border:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card{background:var(--p);border:1px solid var(--l);border-radius:17px;padding:15px}.n{font-size:28px;font-weight:800}.muted{color:var(--m);font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--l);padding:10px 0}.field,select{padding:9px;border:1px solid var(--l);border-radius:10px;background:#0b0e17;color:#fff;font-family:inherit}.danger{color:var(--r)}.hide{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.row{align-items:flex-start;flex-direction:column}}</style></head><body><div class="w"><div class="top"><div><h2>لوحة إدارة مربوعة</h2><div class="muted">جزء من Shahboun Admin</div></div><div><a class="btn" href="./">مربوعة</a> <a class="btn" href="../../admin.html">إدارة شهبون</a></div></div><div id="denied" class="card hide">هذه الصفحة لحساب Admin/Owner فقط.</div><main id="main" class="hide"><div id="stats" class="grid"></div><div class="card"><h3>البلاغات</h3><div id="reports"></div></div><div class="card" style="margin-top:12px"><h3>المستخدمون</h3><input id="q" class="field" placeholder="بحث" oninput="loadUsers()"><div id="users"></div></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const s=createClient('https://uojytcmeqegnlgvlmexx.supabase.co','sb_publishable_IB9p4LAK2s7VLW1u55SJQA_pANuxzHl'),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function boot(){const{data:{user}}=await s.auth.getUser();if(!user)return denied.classList.remove('hide');const{data:ok}=await s.rpc('marboua_is_admin');if(!ok)return denied.classList.remove('hide');main.classList.remove('hide');loadStats();loadReports();loadUsers()}async function loadStats(){const{data}=await s.rpc('marboua_admin_stats');const a=[['المستخدمون',data?.users],['المتصلون',data?.online],['المجموعات',data?.groups],['الرسائل',data?.messages],['البلاغات',data?.open_reports],['المكالمات',data?.calls]];stats.innerHTML=a.map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="n">${x[1]||0}</div></div>`).join('')}async function loadReports(){const{data}=await s.from('marboua_reports').select('*').order('created_at',{ascending:false}).limit(100);reports.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="row"><div><b>${esc(x.reason)}</b><div class="muted">${esc(x.details||'')} • ${new Date(x.created_at).toLocaleString('ar-LY')}</div></div><select onchange="setReport('${x.id}',this.value)"><option ${x.status==='open'?'selected':''}>open</option><option ${x.status==='reviewing'?'selected':''}>reviewing</option><option ${x.status==='resolved'?'selected':''}>resolved</option><option ${x.status==='dismissed'?'selected':''}>dismissed</option></select></div>`).join(''):'لا توجد بلاغات.'}window.setReport=async(id,status)=>{const{error}=await s.rpc('marboua_admin_update_report',{p_report:id,p_status:status});if(error)alert(error.message);else loadReports()};window.loadUsers=async()=>{let query=s.from('marboua_profiles').select('*').order('created_at',{ascending:false}).limit(100),term=q.value.trim();if(term)query=query.or(`display_name.ilike.%${term}%,username.ilike.%${term}%`);const{data}=await query;users.innerHTML=(data||[]).map(x=>`<div class="row"><div><b>${esc(x.display_name)}</b> <span class="muted">@${esc(x.username||'')}</span><div class="muted">${esc(x.city||'')} • ${x.gender==='male'?'راجل':'مرا'} • ${esc(x.moderation_status||'active')}</div></div><div><button class="btn" onclick="statusUser('${x.user_id}','active')">تفعيل</button> <button class="btn" onclick="statusUser('${x.user_id}','suspended')">إيقاف</button> <button class="btn danger" onclick="statusUser('${x.user_id}','banned')">حظر</button></div></div>`).join('')};window.statusUser=async(id,status)=>{let note=status==='active'?null:prompt('ملاحظة الإدارة (اختياري)');const{error}=await s.rpc('marboua_admin_set_user_status',{p_user:id,p_status:status,p_note:note});if(error)alert(error.message);else{loadUsers();loadStats()}};boot();</script></body></html>
