name: Clean Shahboun Licensing 6.0.1 Standalone

on:
  push:
    branches: [suite-6.0.1-clean]
    paths:
      - 'apps/licensing-current/**'
      - '.github/workflows/clean-licensing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical identity and approved branding
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "com.shahboun.licensing" apps/licensing-current/app.config.js
          grep -Fq "versionCode: 61" apps/licensing-current/app.config.js
          grep -Fq "9d835e52-7b7d-4a08-83a6-b21ad88b066c" apps/licensing-current/app.config.js
          test -s apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/icon.png apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/adaptive-icon.png apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/splash.png apps/licensing-current/assets/official-logo.png
      - name: Install dependencies
        working-directory: apps/licensing-current
        run: npm install --no-audit --no-fund
      - name: TypeScript
        working-directory: apps/licensing-current
        run: npm run typecheck
      - name: Expo native generation
        working-directory: apps/licensing-current
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android identity
        shell: bash
        run: |
          set -euo pipefail
          grep -R "applicationId.*com.shahboun.licensing" apps/licensing-current/android/app/build.gradle
      - name: Build standalone release APK
        working-directory: apps/licensing-current/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify final APK identity and embedded JS
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/licensing-current/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' /tmp/apk-list.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          BADGING=$($AAPT dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.shahboun.licensing'"
          echo "$BADGING" | grep -F "versionCode='61'"
      - name: Package verified standalone result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=apps/licensing-current/android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" dist/Shahboun_Licensing_6.0.1_STANDALONE.apk
          sha256sum dist/Shahboun_Licensing_6.0.1_STANDALONE.apk > dist/Shahboun_Licensing_6.0.1_STANDALONE.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Licensing-6.0.1-STANDALONE
          path: dist/
          if-no-files-found: error
          retention-days: 14
