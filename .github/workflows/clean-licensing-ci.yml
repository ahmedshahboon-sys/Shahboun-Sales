name: Shahboun Licensing 6.0.2 Verified Owner Update

on:
  push:
    branches: [suite-6.0.2-repair]
    paths:
      - 'apps/licensing-current/**'
      - '.github/workflows/clean-licensing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-prove-owner-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify owner app identity, direct-open behavior and official brand
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "package: 'com.shahboun.licensing'" apps/licensing-current/app.config.js
          grep -Fq "version: '6.0.2'" apps/licensing-current/app.config.js
          grep -Fq "versionCode: 62" apps/licensing-current/app.config.js
          test -s apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/icon.png apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/adaptive-icon.png apps/licensing-current/assets/official-logo.png
          cmp -s apps/licensing-current/assets/splash.png apps/licensing-current/assets/official-logo.png
          ! grep -Fq "DEFAULT_PASSWORD" apps/licensing-current/App.tsx
          ! grep -Fq "PASSWORD_KEY" apps/licensing-current/App.tsx
          grep -Fq "خاص بالمالك — يفتح مباشرة بدون كلمة مرور أو PIN" apps/licensing-current/App.tsx

      - name: Install, typecheck and generate native project
        working-directory: apps/licensing-current
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
          NODE_ENV: production
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npx expo prebuild --platform android --clean --no-install

      - name: Build standalone owner APK using same pipeline as approved 6.0.1
        working-directory: apps/licensing-current/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect new APK and download approved 6.0.1 owner reference
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-licensing /tmp/shb-old-lic
          cp apps/licensing-current/android/app/build/outputs/apk/release/app-release.apk dist-licensing/Shahboun_Licensing_6.0.2_OWNER_UPDATE.apk
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ahmedshahboon-sys/Shahboun-Sales/actions/artifacts/9255879587/zip \
            -o /tmp/shb-old-lic.zip
          unzip -q /tmp/shb-old-lic.zip -d /tmp/shb-old-lic
          OLD=$(find /tmp/shb-old-lic -type f -name '*.apk' | head -1)
          test -s "$OLD"
          cp "$OLD" /tmp/Shahboun_Licensing_6.0.1_REFERENCE.apk

      - name: Prove package/version and signer compatibility
        shell: bash
        run: |
          set -euo pipefail
          NEW=dist-licensing/Shahboun_Licensing_6.0.2_OWNER_UPDATE.apk
          OLD=/tmp/Shahboun_Licensing_6.0.1_REFERENCE.apk
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(find "$SDKROOT/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$SDKROOT/build-tools" -type f -name apksigner | sort -V | tail -1)
          NEWBAD=$($AAPT dump badging "$NEW")
          OLDBAD=$($AAPT dump badging "$OLD")
          echo "$NEWBAD" | grep -F "package: name='com.shahboun.licensing'"
          echo "$NEWBAD" | grep -F "versionCode='62'"
          echo "$OLDBAD" | grep -F "package: name='com.shahboun.licensing'"
          echo "$OLDBAD" | grep -F "versionCode='61'"
          "$APKSIGNER" verify --verbose --print-certs "$NEW" | tee dist-licensing/Shahboun_Licensing_6.0.2.signing.txt
          "$APKSIGNER" verify --verbose --print-certs "$OLD" > /tmp/old-lic-signing.txt
          NEWCERT=$(grep -m1 'certificate SHA-256 digest:' dist-licensing/Shahboun_Licensing_6.0.2.signing.txt | sed 's/.*digest: //')
          OLDCERT=$(grep -m1 'certificate SHA-256 digest:' /tmp/old-lic-signing.txt | sed 's/.*digest: //')
          echo "6.0.1 certificate: $OLDCERT"
          echo "6.0.2 certificate: $NEWCERT"
          test -n "$NEWCERT" && test "$NEWCERT" = "$OLDCERT"
          unzip -l "$NEW" > /tmp/new-lic-list.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' /tmp/new-lic-list.txt
          sha256sum "$NEW" > dist-licensing/Shahboun_Licensing_6.0.2_OWNER_UPDATE.apk.sha256
          printf 'UPDATE_COMPATIBLE_WITH=6.0.1\nPACKAGE=com.shahboun.licensing\nOLD_VERSION_CODE=61\nNEW_VERSION_CODE=62\nCERT_SHA256=%s\nDIRECT_OPEN=true\n' "$NEWCERT" > dist-licensing/OWNER_UPDATE_COMPATIBILITY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Licensing-6.0.2-VERIFIED-OWNER-UPDATE
          path: |
            dist-licensing/Shahboun_Licensing_6.0.2_OWNER_UPDATE.apk
            dist-licensing/Shahboun_Licensing_6.0.2_OWNER_UPDATE.apk.sha256
            dist-licensing/Shahboun_Licensing_6.0.2.signing.txt
            dist-licensing/OWNER_UPDATE_COMPATIBILITY.txt
          if-no-files-found: error
          retention-days: 30
