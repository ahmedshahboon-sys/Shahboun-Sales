name: Clean Shahboun Licensing 6.0.1 CI

on:
  push:
    branches: [suite-6.0.1-clean]
    paths:
      - 'apps/licensing-current/**'
      - '.github/workflows/clean-licensing-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "com.shahboun.licensing" apps/licensing-current/app.config.js
          grep -Fq "versionCode: 61" apps/licensing-current/app.config.js
          grep -Fq "9d835e52-7b7d-4a08-83a6-b21ad88b066c" apps/licensing-current/app.config.js
          test -f apps/licensing-current/assets/official-logo.png
      - name: Install dependencies
        working-directory: apps/licensing-current
        run: npm install --no-audit --no-fund
      - name: TypeScript
        working-directory: apps/licensing-current
        run: npm run typecheck
      - name: Expo native generation
        working-directory: apps/licensing-current
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Build installable CI APK
        working-directory: apps/licensing-current/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Package CI result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/licensing-current/android/app/build/outputs/apk/debug/app-debug.apk dist/Shahboun_Licensing_6.0.1_CI.apk
          sha256sum dist/Shahboun_Licensing_6.0.1_CI.apk > dist/Shahboun_Licensing_6.0.1_CI.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Licensing-6.0.1-CI
          path: dist/
          if-no-files-found: error
          retention-days: 14
