name: Export AQIM Signing Key

on:
  push:
    branches: [ main ]
    paths: ['.github/workflows/export-aqim-signing-key.yml']
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch AQIM signing key
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/ahmedshahboon-sys/shahboun-build/main/Aqim/keystore.b64" -o keystore.b64
          base64 -d keystore.b64 > aqim-release.jks
          keytool -list -v -keystore aqim-release.jks -storepass 'AqimShahboun2026!' -alias aqim > key-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aqim-signing-key-temporary
          path: |
            aqim-release.jks
            key-info.txt
          retention-days: 1
