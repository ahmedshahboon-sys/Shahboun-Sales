name: Build Shahboun Suite 6 Android

on:
  push:
    branches: [suite-6.0.0]
    paths:
      - 'apps/android-current/**'
      - '.ci-assets/official-logo.b64.*'
      - '.github/workflows/suite-6-build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sales-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/android-current
    steps:
      - uses: actions/checkout@v4
      - name: Restore approved Shahboun logo
        working-directory: .
        shell: bash
        run: |
          cat .ci-assets/official-logo.b64.* | base64 -d > apps/android-current/assets/images/official-logo.jpg
          test -s apps/android-current/assets/images/official-logo.jpg
          sha256sum apps/android-current/assets/images/official-logo.jpg
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Generate Android native project
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --clean --no-install
      - name: Optimize release package
        run: |
          printf '\nreactNativeArchitectures=arm64-v8a,armeabi-v7a\nandroid.enableMinifyInReleaseBuilds=true\nandroid.enableShrinkResourcesInReleaseBuilds=true\n' >> android/gradle.properties
      - name: Build release APK
        working-directory: apps/android-current/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Collect and inspect APK
        run: |
          mkdir -p ../../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../../dist/Shahboun_Sales_6.0.1.apk
          sha256sum ../../dist/Shahboun_Sales_6.0.1.apk > ../../dist/Shahboun_Sales_6.0.1.apk.sha256
          SDKROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(find "$SDKROOT/build-tools" -name apksigner -type f | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then "$APKSIGNER" verify --print-certs ../../dist/Shahboun_Sales_6.0.1.apk | tee ../../dist/Shahboun_Sales_6.0.1.signing.txt; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Sales-6.0.1
          path: |
            dist/Shahboun_Sales_6.0.1.apk
            dist/Shahboun_Sales_6.0.1.apk.sha256
            dist/Shahboun_Sales_6.0.1.signing.txt
          if-no-files-found: error
          retention-days: 30
