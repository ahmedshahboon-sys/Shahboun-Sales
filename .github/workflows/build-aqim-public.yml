name: Build Aqim Unsigned APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AqimBuild/**'
      - '.github/workflows/build-aqim-public.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Add Cairo, Quran riwayat, fonts, logo placeholder and adhan audio
        run: |
          mkdir -p AqimBuild/app/src/main/res/raw AqimBuild/app/src/main/res/font AqimBuild/app/src/main/res/drawable AqimBuild/app/src/main/assets/quran
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf" -o AqimBuild/app/src/main/res/font/cairo.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/qaloon/data/QaloonData_v10.json" -o AqimBuild/app/src/main/assets/quran/qaloon.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/hafs/data/hafsData_v18.json" -o AqimBuild/app/src/main/assets/quran/hafs.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/warsh/data/warshData_v10.json" -o AqimBuild/app/src/main/assets/quran/warsh.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/shouba/data/ShoubaData08.json" -o AqimBuild/app/src/main/assets/quran/shouba.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/qaloon/font/qaloon.10.ttf" -o AqimBuild/app/src/main/res/font/quran_qaloon.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/hafs/font/hafs.18.ttf" -o AqimBuild/app/src/main/res/font/quran_hafs.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/warsh/font/warsh.10.ttf" -o AqimBuild/app/src/main/res/font/quran_warsh.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/shouba/font/shouba.8.ttf" -o AqimBuild/app/src/main/res/font/quran_shouba.ttf
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/a/a9/Muslim_calling_to_prayer.ogg" -o AqimBuild/app/src/main/res/raw/adhan_default.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Azan.ogg" -o AqimBuild/app/src/main/res/raw/adhan_classic.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Adhan%2C%20Great%20Mosque%20of%20Mecca%20-%20Jan%2021%2C%202013.webm" -o AqimBuild/app/src/main/res/raw/adhan_mecca_2013.webm
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/33937%20ejaz215%20call-to-prayer-from-the-prophet-s-mo.ogg" -o AqimBuild/app/src/main/res/raw/adhan_prophet_mosque.ogg
          curl -L --fail --retry 3 "https://commons.wikimedia.org/wiki/Special:Redirect/file/Call_to_prayer.ogg" -o AqimBuild/app/src/main/res/raw/adhan_africa.ogg
          echo '' | base64 -d > AqimBuild/app/src/main/res/drawable/aqim_logo.jpg
      - name: Validate Quran assets
        run: |
          python3 - <<'PY'
          import json,glob,hashlib,os,re
          for f in glob.glob('AqimBuild/app/src/main/assets/quran/*.json'):
              with open(f,encoding='utf-8') as h: d=json.load(h)
              assert isinstance(d,list) and len(d)>6000, (f,len(d))
              def sura(x): return int(x.get('sura_no', x.get('sora',0)))
              suras={sura(x) for x in d}
              assert suras==set(range(1,115)), (f,len(suras),min(suras),max(suras))
              for x in d:
                  assert int(x.get('aya_no',0))>0 and str(x.get('aya_text','')).strip()
                  assert re.search(r'\d+',str(x.get('page','')))
              print(os.path.basename(f),len(d),hashlib.sha256(open(f,'rb').read()).hexdigest())
          PY
      - name: Patch global timezone labels and direct section routing
        run: |
          python3 - <<'PY'
          p='AqimBuild/app/src/main/java/com/shahboun/aqim/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('TimeZone.getTimeZone("Africa/Tripoli")','TimeZone.getTimeZone(c.getSharedPreferences(PREF,MODE_PRIVATE).getString("tzId","Africa/Tripoli"))')
          s=s.replace('الإصدار 1.3.0','الإصدار 1.4.0').replace('أَقِم – مؤذن ليبيا ومواقيت الصلاة','أَقِم – الصلاة والذكر والقرآن')
          old='loadFont();requestRuntimePermissions();if(!getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false))showOnboarding();else showHome();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          new='loadFont();requestRuntimePermissions();String target=getIntent().getStringExtra("target");boolean onboarded=getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false);if(!onboarded||"onboarding".equals(target))showOnboarding();else if("settings".equals(target))showSettings();else if("tasbih".equals(target))showTasbih();else if("prayers".equals(target))showPrayerTimes();else showHome();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          if old not in s: raise SystemExit('MainActivity routing anchor not found')
          s=s.replace(old,new)
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build unsigned release APK
        working-directory: AqimBuild
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK and official signer
        run: |
          mkdir -p output
          cp AqimBuild/app/build/outputs/apk/release/app-release-unsigned.apk output/AQIM-v1.4.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AQIM-v1.4.0-build-kit
          path: output/
          if-no-files-found: error
          retention-days: 30
