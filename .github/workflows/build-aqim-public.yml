name: Build Aqim Unsigned APK

on:
  push:
    branches: [ main ]
    paths:
      - 'AqimBuild/**'
      - '.github/workflows/build-aqim-public.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Add CC0 default adhan audio
        run: |
          mkdir -p AqimBuild/app/src/main/res/raw
          curl -L --fail --retry 3 "https://upload.wikimedia.org/wikipedia/commons/a/a9/Muslim_calling_to_prayer.ogg" -o AqimBuild/app/src/main/res/raw/adhan_default.ogg
      - name: Build unsigned release APK
        working-directory: AqimBuild
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare APK and official signer
        run: |
          mkdir -p output
          cp AqimBuild/app/build/outputs/apk/release/app-release-unsigned.apk output/AQIM-v1.1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AQIM-v1.1.0-build-kit
          path: output/
          if-no-files-found: error
          retention-days: 30
