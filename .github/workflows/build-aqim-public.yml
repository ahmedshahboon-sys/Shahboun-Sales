name: Build Aqim Unsigned APK

on:
  push:
    branches: [ main ]
    paths: ['AqimBuild/**','.github/workflows/build-aqim-public.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Add Cairo and validated Quran assets
        run: |
          mkdir -p AqimBuild/app/src/main/res/font AqimBuild/app/src/main/assets/quran
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf" -o AqimBuild/app/src/main/res/font/cairo.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/qaloon/data/QaloonData_v10.json" -o AqimBuild/app/src/main/assets/quran/qaloon.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/hafs/data/hafsData_v18.json" -o AqimBuild/app/src/main/assets/quran/hafs.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/warsh/data/warshData_v10.json" -o AqimBuild/app/src/main/assets/quran/warsh.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/shouba/data/ShoubaData08.json" -o AqimBuild/app/src/main/assets/quran/shouba.json
      - name: Validate Quran assets
        run: |
          python3 - <<'PY'
          import json,glob
          for f in glob.glob('AqimBuild/app/src/main/assets/quran/*.json'):
            d=json.load(open(f,encoding='utf-8'))
            assert isinstance(d,list) and len(d)>6000
            assert {int(x.get('sura_no',x.get('sora',0))) for x in d}==set(range(1,115))
          PY
      - name: Patch 1.5.0 routing timezone and permissions
        run: |
          python3 - <<'PY'
          p='AqimBuild/app/src/main/java/com/shahboun/aqim/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('import android.accessibilityservice.AccessibilityServiceInfo;\n','').replace('import android.view.accessibility.AccessibilityManager;\n','')
          s=s.replace('TimeZone.getTimeZone("Africa/Tripoli")','TimeZone.getTimeZone(c.getSharedPreferences(PREF,MODE_PRIVATE).getString("tzId",TimeZone.getDefault().getID()))')
          s=s.replace('الإصدار 1.3.0','الإصدار 1.5.0').replace('الإصدار 1.4.0','الإصدار 1.5.0')
          old='loadFont();requestRuntimePermissions();if(!getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false))showOnboarding();else showHome();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          new='loadFont();requestRuntimePermissions();String target=getIntent().getStringExtra("target");boolean onboarded=getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false);if(!onboarded||"onboarding".equals(target))showOnboarding();else if("settings".equals(target))showSettings();else if("tasbih".equals(target))showTasbih();else if("prayers".equals(target))showPrayerTimes();else if("about".equals(target))showAbout();else showHome();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          if old in s:s=s.replace(old,new)
          s=s.replace('addPermission(root,"إيقاف الأذان بزر الصوت",accessibilityEnabled(),v->startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));','cardAdd(root,text("إيقاف الأذان بزر رفع/خفض الصوت يعمل أثناء تشغيل الأذان ولا يحتاج خدمة إمكانية الوصول.",13,MUTED,false));')
          start=s.find('    boolean accessibilityEnabled(){')
          if start!=-1:
            end=s.find('\n\n    void requestRuntimePermissions()',start)
            if end!=-1:s=s[:start]+s[end+2:]
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build release APK
        working-directory: AqimBuild
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare 1.5.0 APK
        run: |
          mkdir -p output
          cp AqimBuild/app/build/outputs/apk/release/app-release-unsigned.apk output/AQIM-v1.5.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AQIM-v1.5.0-build-kit
          path: output/
          retention-days: 30
