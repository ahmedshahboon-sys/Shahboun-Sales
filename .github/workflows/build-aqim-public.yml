name: Build Aqim Unsigned APK

on:
  push:
    branches: [ main ]
    paths: ['AqimBuild/**','.github/workflows/build-aqim-public.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Add Cairo and KFGQPC Quran assets with matching narration fonts
        run: |
          mkdir -p AqimBuild/app/src/main/res/font AqimBuild/app/src/main/assets/quran
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/cairo/Cairo%5Bslnt,wght%5D.ttf" -o AqimBuild/app/src/main/res/font/cairo.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/qaloon/data/QaloonData_v10.json" -o AqimBuild/app/src/main/assets/quran/qaloon.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/hafs/data/hafsData_v18.json" -o AqimBuild/app/src/main/assets/quran/hafs.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/warsh/data/warshData_v10.json" -o AqimBuild/app/src/main/assets/quran/warsh.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/shouba/data/ShoubaData08.json" -o AqimBuild/app/src/main/assets/quran/shouba.json
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/qaloon/font/qaloon.10.ttf" -o AqimBuild/app/src/main/res/font/quran_qaloon.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/hafs/font/hafs.18.ttf" -o AqimBuild/app/src/main/res/font/quran_hafs.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/warsh/font/warsh.10.ttf" -o AqimBuild/app/src/main/res/font/quran_warsh.ttf
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/thetruetruth/quran-data-kfgqpc/main/shouba/font/shouba.8.ttf" -o AqimBuild/app/src/main/res/font/quran_shouba.ttf
      - name: Validate Quran data and narration fonts
        run: |
          python3 - <<'PY'
          import json,glob,os
          for f in glob.glob('AqimBuild/app/src/main/assets/quran/*.json'):
            d=json.load(open(f,encoding='utf-8'))
            assert isinstance(d,list) and len(d)>6000, f
            suras={int(x.get('sura_no',x.get('sora',0))) for x in d}
            assert suras==set(range(1,115)), (f,len(suras))
            per={}
            for x in d:
              s=int(x.get('sura_no',x.get('sora',0))); a=int(x.get('aya_no',0)); text=str(x.get('aya_text','')).strip()
              assert 1<=s<=114 and a>=1 and text, (f,s,a)
              if s in per: assert a>=per[s], (f,s,a,per[s])
              per[s]=a
          for f in glob.glob('AqimBuild/app/src/main/res/font/quran_*.ttf'):
            assert os.path.getsize(f)>200000, (f,os.path.getsize(f))
          assert len(glob.glob('AqimBuild/app/src/main/res/font/quran_*.ttf'))==4
          PY
      - name: Patch AQIM runtime UI
        run: |
          python3 - <<'PY'
          p='AqimBuild/app/src/main/java/com/shahboun/aqim/MainActivity.java'
          s=open(p,encoding='utf-8').read()
          s=s.replace('import android.accessibilityservice.AccessibilityServiceInfo;\n','').replace('import android.view.accessibility.AccessibilityManager;\n','')
          s=s.replace('TimeZone.getTimeZone("Africa/Tripoli")','TimeZone.getTimeZone(c.getSharedPreferences(PREF,MODE_PRIVATE).getString("tzId",TimeZone.getDefault().getID()))')
          s=s.replace('الإصدار 1.3.0','الإصدار 1.5.2').replace('الإصدار 1.4.0','الإصدار 1.5.2').replace('الإصدار 1.5.0','الإصدار 1.5.2').replace('الإصدار 1.5.1','الإصدار 1.5.2')
          s=s.replace('p.getString("adhanChoice","mecca2013")','p.getString("adhanChoice","yasser_aldosari")')
          s=s.replace('final Runnable tick=new Runnable(){public void run(){refreshHeader();handler.postDelayed(this,30000);}};','final Runnable tick=new Runnable(){public void run(){refreshHeader();handler.postDelayed(this,PrayerPresentation.showSeconds(MainActivity.this)?1000:30000);}};')
          old='loadFont();requestRuntimePermissions();if(!getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false))showOnboarding();else showHome();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          new='loadFont();requestRuntimePermissions();String target=getIntent().getStringExtra("target");boolean onboarded=getSharedPreferences(PREF,MODE_PRIVATE).getBoolean("onboarded",false);if(!onboarded||"onboarding".equals(target))showOnboarding();else if("settings".equals(target))showSettings();else if("tasbih".equals(target))showTasbih();else if("prayers".equals(target))showPrayerTimes();else if("about".equals(target))showAbout();else finish();scheduleAll(this);startStatusIfEnabled();handler.post(tick);'
          if old in s:s=s.replace(old,new)
          start=s.find('    void showAdhanPicker(boolean fajr){')
          end=s.find('\n    String adhanLabel(',start)
          if start!=-1 and end!=-1:
            repl='''    void showAdhanPicker(boolean fajr){screen=9;LinearLayout root=page(fajr?"اختيار أذان الفجر":"اختيار صوت الأذان");SharedPreferences p=getSharedPreferences(PREF,MODE_PRIVATE);final String[] chosen={p.getString(fajr?"fajrChoice":"adhanChoice","yasser_aldosari")};String[][] a={{"abdelrahman_alqodai","عبدالرحمن القضاعي"},{"islam_sobhi","إسلام صبحي"},{"omar_hisham","عمر هشام العربي"},{"nasser_alqatami","ناصر القطامي"},{"yasser_aldosari","ياسر الدوسري"},{"custom","ملف من الهاتف"}};root.addView(text("اضغط على اسم المؤذن للمعاينة. لن يتغير الصوت المعتمد إلا بعد الضغط على حفظ.",13,MUTED,false));for(String[] x:a){Button b=button(x[1],false);b.setOnClickListener(v->{chosen[0]=x[0];stopAdhan();Intent pi=new Intent(this,AdhanService.class).putExtra("prayer",fajr?"الفجر":"اختبار").putExtra("mode","PRAYER").putExtra("test",true).putExtra("choiceOverride",x[0]);if(Build.VERSION.SDK_INT>=26)startForegroundService(pi);else startService(pi);});addSetting(root,b);}Button stop=button("إيقاف المعاينة",false);stop.setOnClickListener(v->stopAdhan());addSetting(root,stop);Button save=button("حفظ واعتماد الصوت",true);save.setOnClickListener(v->{stopAdhan();p.edit().putString(fajr?"fajrChoice":"adhanChoice",chosen[0]).apply();showSettings();});addSetting(root,save);setContentView(scroll(root));}'''
            s=s[:start]+repl+s[end:]
          start=s.find('    String adhanLabel(String c){')
          if start!=-1:
            end=s.find('\n    void showFollowSettings()',start)
            if end!=-1:s=s[:start]+'    String adhanLabel(String c){return AdhanService.labelFor(c);}\n'+s[end:]
          start=s.find('    void showPrayerTimes(){')
          end=s.find('\n    void showAzkar(){',start)
          if start!=-1 and end!=-1:
            repl='    void showPrayerTimes(){screen=1;LinearLayout root=page("مواقيت الصلاة");LinkedHashMap<String,Calendar> t=todayTimes(this);TimeZone tz=TimeZone.getTimeZone(getSharedPreferences(PREF,MODE_PRIVATE).getString("tzId",TimeZone.getDefault().getID()));Calendar now=Calendar.getInstance(tz);for(Map.Entry<String,Calendar> e:t.entrySet()){if("الغروب".equals(e.getKey()))continue;LinearLayout row=new LinearLayout(this);row.setOrientation(LinearLayout.VERTICAL);row.setGravity(Gravity.CENTER);row.addView(text(e.getKey()+"   "+PrayerPresentation.format(this,e.getValue()),18,GREEN,true),new LinearLayout.LayoutParams(-1,dp(42)));if(!"الشروق".equals(e.getKey()))row.addView(text(PrayerPresentation.iqamaStatus(this,e.getKey(),e.getValue(),now),13,MUTED,false),new LinearLayout.LayoutParams(-1,dp(34)));cardAdd(root,row);}TextView note=text("حساب محلي Offline • المنطقة الزمنية: "+tz.getID()+" • يمكنك تعديل طريقة العرض والإقامة وفروق الدقائق من الإعدادات.",13,MUTED,false);cardAdd(root,note);setContentView(scroll(root));}'
            s=s[:start]+repl+s[end:]
          anchor='        Button city=button("المدينة: "+p.getString("city","طرابلس")+"  ▼",false);city.setOnClickListener(v->showCityPicker());addSetting(root,city);'
          addition='        Button city=button("المدينة: "+p.getString("city","طرابلس")+"  ▼",false);city.setOnClickListener(v->showCityPicker());addSetting(root,city);\n        Button fmt=button("نظام الوقت: "+(p.getBoolean("time24",true)?"24 ساعة":"12 ساعة"),false);fmt.setOnClickListener(v->{p.edit().putBoolean("time24",!p.getBoolean("time24",true)).apply();showSettings();});addSetting(root,fmt);\n        Button secs=button(p.getBoolean("showSeconds",true)?"إخفاء الثواني":"إظهار الثواني",false);secs.setOnClickListener(v->{p.edit().putBoolean("showSeconds",!p.getBoolean("showSeconds",true)).apply();showSettings();});addSetting(root,secs);\n        Button iq=button("إعداد أوقات الإقامة لكل صلاة",false);iq.setOnClickListener(v->showIqamaSettings());addSetting(root,iq);'
          s=s.replace(anchor,addition)
          marker='    void showOffsets(){'
          if marker in s and 'void showIqamaSettings(){' not in s:
            iqama='    void showIqamaSettings(){screen=12;LinearLayout root=page("أوقات الإقامة");SharedPreferences p=getSharedPreferences(PREF,MODE_PRIVATE);String[] names={"الفجر","الظهر","العصر","المغرب","العشاء"};String[] keys={"iqama_fajr","iqama_dhuhr","iqama_asr","iqama_maghrib","iqama_isha"};int[] defs={20,20,20,10,20};EditText[] es=new EditText[names.length];for(int i=0;i<names.length;i++){es[i]=numField(String.valueOf(p.getInt(keys[i],defs[i])));cardAdd(root,labeled("الإقامة بعد أذان "+names[i]+" بالدقائق",es[i]));}Button save=button("حفظ أوقات الإقامة",true);save.setOnClickListener(v->{SharedPreferences.Editor ed=p.edit();for(int i=0;i<keys.length;i++)ed.putInt(keys[i],Math.max(0,Math.min(120,number(es[i],defs[i]))));ed.apply();PrayerWidget.updateAll(this);showSettings();});addSetting(root,save);setContentView(scroll(root));}\n'
            s=s.replace(marker,iqama+marker)
          start=s.find('    public static String[] nextPrayerInfo(Context c){')
          end=s.find('\n    static double[] currentLatLon(Context c){',start)
          if start!=-1 and end!=-1:
            repl='    public static String[] nextPrayerInfo(Context c){TimeZone tz=TimeZone.getTimeZone(c.getSharedPreferences(PREF,MODE_PRIVATE).getString("tzId",TimeZone.getDefault().getID()));LinkedHashMap<String,Calendar> times=todayTimes(c);Calendar now=Calendar.getInstance(tz);String found=null;Calendar when=null;for(Map.Entry<String,Calendar>e:times.entrySet()){if("الشروق".equals(e.getKey())||"الغروب".equals(e.getKey()))continue;if(e.getValue().after(now)){found=e.getKey();when=e.getValue();break;}}if(found==null){Calendar d=(Calendar)now.clone();d.add(Calendar.DAY_OF_MONTH,1);found="الفجر";when=timesFor(c,d).get("الفجر");}long ms=Math.max(0,when.getTimeInMillis()-now.getTimeInMillis());String city=c.getSharedPreferences(PREF,MODE_PRIVATE).getString("city","طرابلس");String iq=PrayerPresentation.iqamaStatus(c,found,when,now);return new String[]{found,PrayerPresentation.format(c,when),PrayerPresentation.countdown(c,ms),city+" • "+tz.getID(),iq};}'
            s=s[:start]+repl+s[end:]
          s=s.replace('addPermission(root,"إيقاف الأذان بزر الصوت",accessibilityEnabled(),v->startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));','cardAdd(root,text("إيقاف الأذان بزر رفع/خفض الصوت يعمل أثناء تشغيل الأذان ولا يحتاج خدمة إمكانية الوصول.",13,MUTED,false));')
          start=s.find('    boolean accessibilityEnabled(){')
          if start!=-1:
            end=s.find('\n\n    void requestRuntimePermissions()',start)
            if end!=-1:s=s[:start]+s[end+2:]
          open(p,'w',encoding='utf-8').write(s)
          PY
      - name: Build release APK
        working-directory: AqimBuild
        run: gradle --no-daemon :app:assembleRelease
      - name: Prepare 1.5.2 APK
        run: |
          mkdir -p output
          cp AqimBuild/app/build/outputs/apk/release/app-release-unsigned.apk output/AQIM-v1.5.2-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: AQIM-v1.5.2-build-kit
          path: output/
          retention-days: 30
