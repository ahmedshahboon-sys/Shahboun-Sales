name: Shahboun Windows Setup 6.0.2 Verified

on:
  push:
    branches: [suite-6.0.2-repair]
    paths:
      - '.github/workflows/clean-windows-ci.yml'
      - '.ci-clean/windows/**'
      - '.ci-assets/windows-source-6.0.1.tgz'
      - '.ci-assets/official-logo.b64.*'
      - 'SUITE_VERSION.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-install-smoke:
    runs-on: windows-2025
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Restore canonical Windows source archive
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $archive='.ci-assets/windows-source-6.0.1.tgz'
          if(!(Test-Path $archive)){ throw 'WINDOWS_SOURCE_ARCHIVE_MISSING' }
          if((Get-Item $archive).Length -lt 1000){ throw 'WINDOWS_SOURCE_ARCHIVE_TOO_SMALL' }
          $extract=Join-Path $env:RUNNER_TEMP 'shahboun-win-src'
          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extract | Out-Null
          tar -xzf $archive -C $extract
          if($LASTEXITCODE -ne 0){ throw 'WINDOWS_SOURCE_EXTRACT_FAILED' }
          $root=Join-Path $extract 'Shahboun_Server_Web_Windows'
          if(!(Test-Path (Join-Path $root 'package.json'))){ throw 'WINDOWS_SOURCE_PACKAGE_JSON_NOT_FOUND' }
          Remove-Item apps/windows-current -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force apps/windows-current | Out-Null
          Get-ChildItem $root -Force | Copy-Item -Destination apps/windows-current -Recurse -Force

      - name: Apply repair overrides and preserve update identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path '.ci-clean/windows/overrides'){
            Get-ChildItem '.ci-clean/windows/overrides' -Force | Copy-Item -Destination apps/windows-current -Recurse -Force
          }
          foreach($f in @('BOOTSTRAP_PREREQUISITES.ps1','FIRST_RUN_SETUP.ps1','INSTALL_SERVER_AUTOSTART.ps1')){
            if(!(Test-Path "apps/windows-current/scripts/$f")){ throw "REQUIRED_SCRIPT_MISSING_$f" }
          }
          if(!(Test-Path apps/windows-current/src/services/licenseService.js)){ throw 'LICENSE_SERVICE_MISSING' }
          $iss='apps/windows-current/installer/ShahbounServerSetup.iss'
          if(!(Test-Path $iss)){ throw 'INNO_SCRIPT_MISSING' }
          $txt=Get-Content $iss -Raw
          # Preserve AppId/installation identity, only bump version/output filename.
          $txt=$txt -replace '#define MyAppVersion "6\.0\.1"','#define MyAppVersion "6.0.2"'
          $txt=$txt -replace 'OutputBaseFilename=Shahboun_Server_Setup_6\.0\.1','OutputBaseFilename=Shahboun_Server_Setup_6.0.2'
          Set-Content $iss $txt -Encoding UTF8
          if((Get-Content $iss -Raw) -notmatch 'AppId=\{\{A4F09936-4B15-49E2-A9D6-42F4EAF55601\}'){ throw 'WINDOWS_APPID_CHANGED' }

      - name: Prepare official Shahboun branding only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem '.ci-assets/official-logo.b64.*' | Sort-Object Name
          if(!$parts){ throw 'OFFICIAL_LOGO_PARTS_MISSING' }
          $raw=($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $b64=[regex]::Replace($raw,'[^A-Za-z0-9+/=]','')
          $src=Join-Path $env:RUNNER_TEMP 'official-logo-source.jpg'
          [IO.File]::WriteAllBytes($src,[Convert]::FromBase64String($b64))
          choco install imagemagick -y --no-progress
          $magick=(Get-Command magick.exe).Source
          New-Item -ItemType Directory -Force apps/windows-current/public/assets,apps/windows-current/installer | Out-Null
          & $magick $src -auto-orient -strip 'PNG32:apps/windows-current/public/assets/shahboun-logo.png'
          Copy-Item apps/windows-current/public/assets/shahboun-logo.png apps/windows-current/public/assets/logo.png -Force
          Copy-Item apps/windows-current/public/assets/shahboun-logo.png apps/windows-current/public/assets/icon.png -Force
          & $magick apps/windows-current/public/assets/shahboun-logo.png -define icon:auto-resize=256,128,64,48,32,16 apps/windows-current/installer/shahboun.ico
          if((Get-Item apps/windows-current/public/assets/shahboun-logo.png).Length -lt 1000){ throw 'OFFICIAL_LOGO_INVALID' }

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'

      - name: Install dependencies and run source acceptance checks
        working-directory: apps/windows-current
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --no-audit --no-fund
          if((Get-Content package.json -Raw) -match '"verify:syntax"'){ npm run verify:syntax }
          @'
          DB_HOST=127.0.0.1
          DB_PORT=54329
          DB_NAME=shahboun_lan
          DB_USER=postgres
          DB_PASSWORD=build_check_only
          JWT_SECRET=build_check_only
          TRIAL_HOURS=24
          TRIAL_MAX_DEVICES=5
          '@ | Set-Content .env -Encoding ASCII
          if((Get-Content package.json -Raw) -match '"check:final"'){ npm run check:final }
          if((Get-Content package.json -Raw) -match '"acceptance"'){ npm run acceptance }
          Remove-Item .env -Force

      - name: Verify installer and first-run scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('BOOTSTRAP_PREREQUISITES.ps1','FIRST_RUN_SETUP.ps1','INSTALL_SERVER_AUTOSTART.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path "apps/windows-current/scripts/$f"),[ref]$tokens,[ref]$errors)
            if($errors.Count){ $errors | Out-String | Write-Error; throw "POWERSHELL_SYNTAX_ERROR_$f" }
          }
          $first=Get-Content apps/windows-current/scripts/FIRST_RUN_SETUP.ps1 -Raw
          if($first -notmatch 'DB_PORT=54329'){ throw 'PRIVATE_POSTGRES_PORT_MISSING' }
          if($first -notmatch 'TRIAL_HOURS=24'){ throw 'TRIAL_24H_MISSING' }
          $lic=Get-Content apps/windows-current/src/services/licenseService.js -Raw
          if($lic -notmatch "platform.*windows|windows.*platform"){ Write-Warning 'Windows platform guard text not detected; source acceptance tests must cover licensing.' }

      - name: Prune production dependencies
        working-directory: apps/windows-current
        run: npm prune --omit=dev

      - name: Bundle Node runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Invoke-WebRequest 'https://nodejs.org/dist/v20.19.4/node-v20.19.4-win-x64.zip' -OutFile "$env:RUNNER_TEMP\node.zip"
          Expand-Archive "$env:RUNNER_TEMP\node.zip" "$env:RUNNER_TEMP\node" -Force
          New-Item -ItemType Directory -Force apps/windows-current/runtime/node | Out-Null
          Copy-Item "$env:RUNNER_TEMP\node\node-v20.19.4-win-x64\*" apps/windows-current/runtime/node -Recurse -Force
          $v=& apps/windows-current/runtime/node/node.exe --version
          if($v -ne 'v20.19.4'){ throw "BUNDLED_NODE_INVALID_$v" }

      - name: Bundle PostgreSQL installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force apps/windows-current/runtime | Out-Null
          $dest='apps/windows-current/runtime/postgresql-17.11-1-windows-x64.exe'
          Invoke-WebRequest 'https://get.enterprisedb.com/postgresql/postgresql-17.11-1-windows-x64.exe' -OutFile $dest -MaximumRedirection 10
          if((Get-Item $dest).Length -lt 100MB){ throw 'POSTGRESQL_INSTALLER_INVALID' }

      - name: Compile Inno Setup 6.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(Test-Path apps/windows-current/.env){ throw 'ENV_MUST_NOT_SHIP' }
          choco install innosetup -y --no-progress
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if(!$iscc){ throw 'INNO_SETUP_COMPILER_MISSING' }
          Push-Location apps/windows-current/installer
          & $iscc ShahbounServerSetup.iss
          if($LASTEXITCODE -ne 0){ throw 'INNO_SETUP_BUILD_FAILED' }
          Pop-Location
          $setup='apps/windows-current/installer/Output/Shahboun_Server_Setup_6.0.2.exe'
          if(!(Test-Path $setup)){ throw 'SETUP_EXE_NOT_PRODUCED' }
          if((Get-Item $setup).Length -lt 100MB){ throw 'SETUP_EXE_PAYLOAD_INCOMPLETE' }

      - name: Execute Setup silently and verify installed payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $setup=(Resolve-Path 'apps/windows-current/installer/Output/Shahboun_Server_Setup_6.0.2.exe').Path
          $install=Join-Path $env:RUNNER_TEMP 'ShahbounInstalled602'
          $log=Join-Path $env:RUNNER_TEMP 'ShahbounSetup602.log'
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$install", "/LOG=$log") -Wait -PassThru
          if($p.ExitCode -ne 0){ Get-Content $log -ErrorAction SilentlyContinue; throw "SETUP_INSTALL_FAILED_$($p.ExitCode)" }
          foreach($f in @('.env','runtime\node\node.exe','node_modules\express\package.json','public\assets\shahboun-logo.png')){
            if(!(Test-Path (Join-Path $install $f))){ throw "INSTALLED_FILE_MISSING_$f" }
          }
          $envText=Get-Content (Join-Path $install '.env') -Raw
          if($envText -notmatch 'DB_PORT=54329'){ throw 'INSTALLED_DB_PORT_INVALID' }
          if($envText -notmatch 'TRIAL_HOURS=24'){ throw 'INSTALLED_TRIAL_INVALID' }

      - name: Start installed server and health-check
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $install=Join-Path $env:RUNNER_TEMP 'ShahbounInstalled602'
          $server=Start-Process -FilePath (Join-Path $install 'runtime\node\node.exe') -ArgumentList 'src\server.js' -WorkingDirectory $install -PassThru -WindowStyle Hidden
          try {
            $ok=$false
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Seconds 2
              try {
                $r=Invoke-RestMethod 'http://127.0.0.1:3000/api/health' -TimeoutSec 3
                if($r.ok -eq $true){ $ok=$true; break }
              } catch {}
            }
            if(!$ok){ throw 'INSTALLED_SERVER_HEALTH_CHECK_FAILED' }
          } finally {
            if($server -and !$server.HasExited){ Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Package verified Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force dist-windows | Out-Null
          $setup='apps/windows-current/installer/Output/Shahboun_Server_Setup_6.0.2.exe'
          Copy-Item $setup dist-windows/Shahboun_Server_Setup_6.0.2.exe -Force
          $hash=(Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  Shahboun_Server_Setup_6.0.2.exe" | Set-Content dist-windows/Shahboun_Server_Setup_6.0.2.exe.sha256 -Encoding ASCII

      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Windows-Setup-6.0.2-VERIFIED
          path: dist-windows/
          if-no-files-found: error
          retention-days: 30
