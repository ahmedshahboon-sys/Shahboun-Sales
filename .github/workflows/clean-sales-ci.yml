name: Clean Shahboun Sales 6.0.1 Standalone

on:
  push:
    branches: [suite-6.0.1-clean]
    paths:
      - 'apps/android-current/**'
      - '.github/workflows/clean-sales-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify canonical identity and official branding only
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '"package": "com.shahboun.sales"' apps/android-current/app.json
          grep -Fq '"version": "6.0.1"' apps/android-current/app.json
          grep -Fq '"versionCode": 61' apps/android-current/app.json
          grep -Fq 'cad8ddae-8f8d-46d4-ae4a-3c97809b3960' apps/android-current/app.json
          test -s apps/android-current/assets/images/official-logo.png
          test -s apps/android-current/assets/images/icon.png
          cmp -s apps/android-current/assets/images/official-logo.png apps/android-current/assets/images/icon.png
          ! test -e apps/android-current/assets/images/shahboun-icon.png
      - name: Install dependencies
        working-directory: apps/android-current
        run: npm install --no-audit --no-fund
      - name: TypeScript
        working-directory: apps/android-current
        run: npm run typecheck
      - name: Generate Android native project
        working-directory: apps/android-current
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean --no-install
      - name: Verify generated Android identity
        shell: bash
        run: |
          set -euo pipefail
          grep -R "applicationId.*com.shahboun.sales" apps/android-current/android/app/build.gradle
      - name: Build standalone release APK
        working-directory: apps/android-current/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Verify APK is standalone and matches identity
        shell: bash
        run: |
          set -euo pipefail
          APK=apps/android-current/android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -Eq 'assets/index.android.bundle|assets/.*\.bundle' /tmp/apk-list.txt
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$AAPT"
          BADGING=$($AAPT dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.shahboun.sales'"
          echo "$BADGING" | grep -F "versionCode='61'"
          ! unzip -l "$APK" | grep -qi 'shahboun-icon'
      - name: Package verified result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp apps/android-current/android/app/build/outputs/apk/release/app-release.apk dist/Shahboun_Sales_6.0.1_STANDALONE.apk
          sha256sum dist/Shahboun_Sales_6.0.1_STANDALONE.apk > dist/Shahboun_Sales_6.0.1_STANDALONE.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Shahboun-Sales-6.0.1-STANDALONE
          path: dist/
          if-no-files-found: error
          retention-days: 14
