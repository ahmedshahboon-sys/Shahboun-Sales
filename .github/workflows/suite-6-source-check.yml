name: Shahboun Suite 6 Source Check

on:
  push:
    branches: [suite-6.0.0]
  pull_request:
    branches: [suite-6.0.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Suite version, host policy, secrets and repository hygiene
        run: node scripts/verify-suite-6.mjs
