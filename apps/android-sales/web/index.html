<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>منظومة شهبون للمبيعات</title><style>:root{font-family:Arial,"Noto Kufi Arabic",sans-serif;color:#14243a;background:#f4f6f9}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#071b32,#153b65)}.card{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:20px;box-shadow:0 12px 36px #0001}.login .card{width:min(92vw,420px)}h1{font-size:22px;margin:0 0 8px;color:#102a4a}.muted{color:#708097;font-size:13px}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select{border:1px solid #cfd8e5;border-radius:12px;padding:12px;background:#fff}.primary{border:0;background:#d49a4a;color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}.danger{color:#b21f30}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:#0e2a4a;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800;margin:8px 0 18px}.nav{display:grid;gap:7px}.nav button{border:0;background:transparent;color:#d9e5f2;text-align:right;padding:11px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff18;color:#fff}.main{padding:20px;min-width:0}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.metric b{display:block;font-size:24px;margin-top:6px}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{padding:10px;border-bottom:1px solid #edf0f4;text-align:right}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tools input{padding:10px;border:1px solid #d4dce7;border-radius:10px;min-width:220px}.pos{display:grid;grid-template-columns:1fr 380px;gap:14px}.productgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.product{cursor:pointer}.product b{display:block}.cartline{display:grid;grid-template-columns:1fr 75px 75px 28px;gap:5px;align-items:center;padding:8px 0;border-bottom:1px solid #eee}.cartline input{width:100%;padding:7px;border:1px solid #ddd;border-radius:8px}.total{font-size:22px;font-weight:800;margin:12px 0}@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.nav{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.pos{grid-template-columns:1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.main{padding:12px}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>منظومة شهبون للمبيعات</h1><div class="muted">Shahboun Suite 6.0.0 • Android Host</div><div class="field"><label>اسم المستخدم</label><input id="user" value="admin"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password"></div><button class="primary" onclick="login()">دخول</button><div id="loginErr" class="danger muted" style="margin-top:10px"></div></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">منظومة شهبون</div><div id="store" class="muted" style="color:#b9cbe0;margin-bottom:16px"></div><nav class="nav"><button data-page="dashboard" class="active">لوحة التحكم</button><button data-page="pos">نقطة البيع</button><button data-page="products">الأصناف</button><button data-page="customers">العملاء</button><button data-page="sales">المبيعات</button><button onclick="logout()">تسجيل الخروج</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">لوحة التحكم</h1><div id="who" class="muted"></div></div><button class="primary" onclick="refresh()">تحديث</button></div><section id="page"></section></main></div>
<script>
let token='',boot=null,products=[],customers=[],sales=[],cart=[];const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});const t=await r.text();let j;try{j=JSON.parse(t)}catch{j={raw:t}}if(!r.ok)throw new Error(j.error||('HTTP_'+r.status));return j}
async function login(){try{$('#loginErr').textContent='';const j=await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:$('#user').value,password:$('#pass').value})});token=j.token;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await init()}catch(e){$('#loginErr').textContent='تعذر الدخول: '+e.message}}
function logout(){token='';location.reload()}
async function init(){boot=await api('/api/bootstrap');$('#store').textContent=boot.store?.storeName||'المتجر';$('#who').textContent=(boot.user?.displayName||boot.user?.username||'')+' • '+boot.version;document.querySelectorAll('.nav [data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));await openPage('dashboard')}
async function refresh(){const a=document.querySelector('.nav button.active');await openPage(a?.dataset.page||'dashboard')}
function active(name,title){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===name));$('#title').textContent=title}
async function openPage(name){try{if(name==='dashboard'){active(name,'لوحة التحكم');const d=await api('/api/dashboard');$('#page').innerHTML='<div class="grid">'+[['مبيعات اليوم',d.todaySales||d.salesTotal||0],['الربح التقديري',d.todayProfit||d.profit||0],['ديون العملاء',d.customerDebts||0],['مخزون منخفض',d.lowStock||0]].map(x=>`<div class="card metric"><span>${x[0]}</span><b>${Number(x[1]||0).toFixed(x[0].includes('مخزون')?0:2)}</b></div>`).join('')+'</div>'}
else if(name==='products'){active(name,'الأصناف');products=await api('/api/products');renderProducts()}
else if(name==='customers'){active(name,'العملاء');customers=await api('/api/customers');$('#page').innerHTML=table(customers,[['name','الاسم'],['phone','الهاتف'],['balance','الرصيد']])}
else if(name==='sales'){active(name,'المبيعات');sales=await api('/api/sales');$('#page').innerHTML=table(sales,[['number','الفاتورة'],['createdAt','التاريخ'],['total','الإجمالي'],['paymentMethod','الدفع']])}
else if(name==='pos'){active(name,'نقطة البيع');products=await api('/api/products');customers=await api('/api/customers');renderPos()}}catch(e){$('#page').innerHTML='<div class="card danger">خطأ: '+esc(e.message)+'</div>'}}
function table(rows,cols){return `<div class="card tablewrap"><table class="table"><thead><tr>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(c[0]==='createdAt'?new Date(r[c[0]]).toLocaleString('ar'):r[c[0]])+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`}
function renderProducts(){const qid='pq';$('#page').innerHTML=`<div class="tools"><input id="${qid}" placeholder="بحث بالاسم أو الباركود" oninput="filterProducts()"></div><div id="plist">${table(products,[['name','الصنف'],['barcode','الباركود'],['stock','المخزون'],['price','السعر']])}</div>`}
function filterProducts(){const q=$('#pq').value.toLowerCase();const a=products.filter(p=>(p.name+' '+(p.barcode||'')+' '+(p.sku||'')).toLowerCase().includes(q));$('#plist').innerHTML=table(a,[['name','الصنف'],['barcode','الباركود'],['stock','المخزون'],['price','السعر']])}
function renderPos(){const cards=products.map(p=>`<div class="card product" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${Number(p.price||0).toFixed(2)} د.ل</span><div class="muted">متاح: ${Number(p.stock||0)}</div></div>`).join('');$('#page').innerHTML=`<div class="pos"><div><div class="tools"><input id="posq" placeholder="بحث" oninput="posFilter()"></div><div id="pcards" class="productgrid">${cards}</div></div><div class="card"><h3>الفاتورة</h3><div id="cart"></div><div class="field"><label>العميل</label><select id="cust"><option value="">نقدي / بدون عميل</option>${customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>طريقة الدفع</label><select id="pay"><option value="cash">نقدي</option><option value="transfer">حوالة</option><option value="credit">آجل</option></select></div><div id="sum" class="total">0.00 د.ل</div><button class="primary" style="width:100%" onclick="checkout()">حفظ الفاتورة</button><div id="posmsg" class="muted" style="margin-top:8px"></div></div></div>`;drawCart()}
function posFilter(){const q=$('#posq').value.toLowerCase();$('#pcards').innerHTML=products.filter(p=>(p.name+' '+(p.barcode||'')).toLowerCase().includes(q)).map(p=>`<div class="card product" onclick="add('${p.id}')"><b>${esc(p.name)}</b><span>${Number(p.price||0).toFixed(2)} د.ل</span><div class="muted">متاح: ${Number(p.stock||0)}</div></div>`).join('')}
function add(id){const p=products.find(x=>x.id===id);if(!p)return;const x=cart.find(x=>x.productId===id);if(x)x.qty++;else cart.push({productId:p.id,name:p.name,qty:1,price:Number(p.price||0),cost:Number(p.cost||0),unitFactor:1});drawCart()}
function drawCart(){const el=$('#cart');if(!el)return;el.innerHTML=cart.map((x,i)=>`<div class="cartline"><span>${esc(x.name)}</span><input type="number" min="0.01" step="1" value="${x.qty}" onchange="cart[${i}].qty=Number(this.value);drawCart()"><input type="number" min="0" step="0.01" value="${x.price}" onchange="cart[${i}].price=Number(this.value);drawCart()"><button onclick="cart.splice(${i},1);drawCart()">×</button></div>`).join('');const total=cart.reduce((a,x)=>a+x.qty*x.price,0);$('#sum').textContent=total.toFixed(2)+' د.ل'}
async function checkout(){try{if(!cart.length)throw new Error('السلة فارغة');const method=$('#pay').value,customerId=$('#cust').value||undefined;const j=await api('/api/pos/sale',{method:'POST',body:JSON.stringify({cart,method,customerId,warehouseId:boot.settings?.defaultWarehouseId})});cart=[];drawCart();$('#posmsg').textContent='تم حفظ '+(j.sale?.number||'الفاتورة');products=await api('/api/products');setTimeout(()=>{$('#posmsg').textContent=''},3500)}catch(e){$('#posmsg').textContent='خطأ: '+e.message}}
</script></body></html>
